<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Prashank Pandey — Business Analyst · Interactive 3D Portfolio</title>
    <meta name="description" content="Interactive 3D portfolio of Prashank Pandey, a Business Analyst and data enthusiast. Drive around to explore projects, skills and contact details." />
    <meta name="theme-color" content="#0a0f24" />
    <meta property="og:title" content="Prashank Pandey — Interactive 3D Portfolio" />
    <meta property="og:description" content="Drive around a 3D world to explore my projects, skills and contact details." />
    <meta property="og:type" content="website" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet" />
  </head>
  <body data-theme="night">
    <div id="app"></div>

    <section id="intro">
      <div class="intro-card">
        <p class="kicker">INTERACTIVE 3D PORTFOLIO</p>
        <h1>Prashank <span>Pandey.</span></h1>
        <p class="role">Business Analyst · Data &amp; Technology Enthusiast</p>
        <button id="start" class="btn primary">Start exploring →</button>
        <p class="small">Drive with <kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> or arrow keys · <kbd>E</kbd> to open · joystick on mobile</p>
      </div>
    </section>

    <header class="topbar">
      <a class="brand" href="https://www.linkedin.com/in/prashank-pandey/" target="_blank" rel="noopener noreferrer" aria-label="LinkedIn profile">PP<span>.</span></a>
      <nav id="nav" aria-label="Portfolio sections"></nav>
      <button id="theme" class="icon-btn" aria-label="Toggle day and night">☀</button>
    </header>

    <button id="prompt" class="prompt" hidden></button>

    <aside id="panel" role="dialog" aria-label="Section details" aria-hidden="true">
      <button id="panel-close" class="icon-btn" aria-label="Close">×</button>
      <div id="panel-body"></div>
    </aside>

    <div id="hint" class="hint"><kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd><span>drive · <kbd>E</kbd> open · <kbd>T</kbd> theme</span></div>
    <div class="mini"><canvas id="minimap" width="140" height="140"></canvas><span id="speed">0 km/h</span></div>
    <div id="joystick" aria-hidden="true"><div class="knob"></div></div>
    <div id="fallback" hidden></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
